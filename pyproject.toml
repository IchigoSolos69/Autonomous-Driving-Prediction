[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-driving-prediction"
version = "0.1.0"
description = "Joint motion forecasting and calibrated proximity-risk experiments on Argoverse 2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7,<3", "numpy>=1.26,<3", "pandas>=2,<3", "pyarrow>=17",
  "scipy>=1.13", "shapely>=2", "fastapi>=0.115", "uvicorn>=0.30",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
av2 = ["av2==0.3.6"]
dev = ["pytest>=8", "httpx>=0.27"]
desktop = ["pywebview==6.1; sys_platform == 'win32'"]

[project.scripts]
adp = "adp.cli:main"

[project.gui-scripts]
adp-app = "adp.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

